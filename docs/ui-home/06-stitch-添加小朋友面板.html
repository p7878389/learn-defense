<!-- 轻量交互：头像、名字、年级与预览卡联动 -->
<script>
    function selectAvatar(emoji, buttonElement) {
      document.getElementById('preview-avatar').textContent = emoji;
      const allAvatars = document.querySelectorAll('.avatar-option');
      allAvatars.forEach(btn => {
        btn.className = "avatar-option h-[62px] rounded-2xl bg-stone-50 hover:bg-amber-50 active:translate-y-0.5 border-2 border-stone-200 flex items-center justify-center text-[38px] relative avatar-btn-shadow transition-all";
        const badge = btn.querySelector('.check-badge');
        if (badge) badge.remove();
      });
      buttonElement.className = "avatar-option h-[62px] rounded-2xl bg-amber-50 border-[3.5px] border-[#F28C2E] flex items-center justify-center text-[38px] relative shadow-[0_4px_0_#c2610d] ring-4 ring-amber-200/80 transition-all scale-105 z-10";
      const checkBadge = document.createElement('span');
      checkBadge.className = "check-badge absolute -top-2 -right-2 w-6 h-6 bg-emerald-500 rounded-full text-white text-[14px] font-black flex items-center justify-center border-2 border-white shadow";
      checkBadge.textContent = "✓";
      buttonElement.appendChild(checkBadge);
    }

    function updateNamePreview(value) {
      const trimmed = value.trim();
      document.getElementById('preview-name').textContent = trimmed.length > 0 ? trimmed : "小守卫";
      document.getElementById('submit-btn').disabled = trimmed.length === 0;
      document.getElementById('submit-btn').classList.toggle('opacity-40', trimmed.length === 0);
    }

    function selectGrade(gradeName, buttonElement) {
      document.getElementById('preview-grade').textContent = gradeName;
      const allTabs = document.querySelectorAll('.grade-tab');
      allTabs.forEach(tab => {
        tab.className = "grade-tab h-[52px] py-2.5 rounded-2xl bg-stone-100 hover:bg-stone-200/80 active:translate-y-0.5 text-[#2B2B38] text-[18px] font-black tab-unselected-shadow transition-all";
      });
      buttonElement.className = "grade-tab h-[52px] py-2.5 rounded-2xl bg-[#F28C2E] text-white text-[18px] font-black candy-orange-shadow scale-[1.02] transition-all";
    }

    function submitProfile() {
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = `<span>成功啦！🌱</span>`;
    }
  </script>
