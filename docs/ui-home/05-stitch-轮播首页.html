<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>字灵守卫 - 角色殿堂 (巨幕聚焦舞台)</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: ZCOOL KuaiLe & Nunito & Noto Sans SC -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Nunito:wght@700;800;900&amp;family=Noto+Sans+SC:wght@500;700;900&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FDF8EC',
            brandOrange: '#F28C2E',
            inkText: '#2B2B38',
            grassGreen: '#78C257',
            skyBlue: '#DDF1FF'
          },
          fontFamily: {
            game: ['"ZCOOL KuaiLe"', '"Noto Sans SC"', 'sans-serif'],
            sans: ['"Noto Sans SC"', '"Nunito"', 'sans-serif']
          }
        }
      }
    }
  </script>
<style>
    /* 游戏字灵专属厚重立体文字样式 */
    .game-logo-title {
      font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
      color: #F28C2E;
      text-shadow:
        -3px -3px 0 #FFFFFF,
         3px -3px 0 #FFFFFF,
        -3px  3px 0 #FFFFFF,
         3px  3px 0 #FFFFFF,
        -5px  0   0 #FFFFFF,
         5px  0   0 #FFFFFF,
         0   -5px 0 #FFFFFF,
         0    5px 0 #FFFFFF,
         0    8px 0 #C26117,
         0    14px 6px rgba(74, 30, 2, 0.3);
    }

    /* 聚光灯舞台光芒 */
    .spotlight-cone {
      background: radial-gradient(ellipse 65% 55% at 50% 30%, rgba(255, 238, 168, 0.55) 0%, rgba(254, 243, 199, 0.25) 50%, rgba(253, 248, 236, 0) 100%);
    }

    /* 主角 C 位超级卡片质感 */
    .hero-candy-card {
      box-shadow: 0 14px 0 #D97706, 0 28px 45px -8px rgba(245, 158, 11, 0.45);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-candy-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 18px 0 #B45309, 0 34px 55px -6px rgba(245, 158, 11, 0.5);
    }

    /* 左右候补侧翼卡片 */
    .sub-candy-card {
      box-shadow: 0 8px 0 #E2D7C2, 0 14px 20px -2px rgba(100, 70, 30, 0.08);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 超大糖果厚底主行动 CTA 按钮 */
    .btn-candy-action {
      background: linear-gradient(180deg, #34D399 0%, #10B981 48%, #059669 100%);
      box-shadow: 0 8px 0 #047857, 0 16px 25px rgba(5, 150, 105, 0.4);
      transition: all 0.15s ease-out;
    }
    .btn-candy-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #047857, 0 20px 30px rgba(5, 150, 105, 0.48);
      filter: brightness(1.05);
    }
    .btn-candy-action:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #047857, 0 6px 12px rgba(5, 150, 105, 0.3);
    }

    /* 柔和呼吸浮动动画 */
    @keyframes heroFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-hero-float {
      animation: heroFloat 4.2s ease-in-out infinite;
    }

    @keyframes shineLight {
      0% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.04); }
      100% { opacity: 0.65; transform: scale(1); }
    }
    .animate-stage-shine {
      animation: shineLight 3.6s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .animate-sway {
      animation: sway 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-paper text-inkText w-screen h-screen overflow-hidden select-none flex flex-col justify-between relative font-sans">
<!-- ==================== 聚光灯舞台光芒背景层 ==================== -->
<div class="absolute inset-0 spotlight-cone pointer-events-none z-0 animate-stage-shine"></div>
<!-- 顶部轻柔天空微蓝渐变与小云彩 -->
<div class="absolute inset-x-0 top-0 h-44 bg-gradient-to-b from-[#DDF1FF]/70 via-[#EDF7FF]/30 to-transparent pointer-events-none z-0"></div>
<div class="absolute top-6 left-12 opacity-75 pointer-events-none z-0">
<svg fill="none" height="38" viewbox="0 0 140 48" width="110">
<path d="M25 40C15 40 8 33 8 24C8 16 14 10 22 9C26 4 33 0 42 0C53 0 62 7 64 16C68 14 73 13 78 13C90 13 100 22 100 33C105 33 110 37 110 42C110 42 25 42 25 40Z" fill="white" fill-opacity="0.85"></path>
<circle cx="112" cy="30" fill="white" fill-opacity="0.7" r="14"></circle>
</svg>
</div>
<div class="absolute top-5 right-28 opacity-70 pointer-events-none z-0">
<svg fill="none" height="42" viewbox="0 0 170 56" width="130">
<path d="M30 46C18 46 10 38 10 27C10 18 17 11 27 10C31 4 40 0 51 0C64 0 75 8 77 18C82 16 88 15 94 15C108 15 120 25 120 38C126 38 132 42 132 48C132 48 30 48 30 46Z" fill="white" fill-opacity="0.85"></path>
<circle cx="134" cy="36" fill="white" fill-opacity="0.75" r="16"></circle>
</svg>
</div>
<!-- ==================== 顶部导航栏 ==================== -->
<header class="w-full py-3 px-10 flex justify-between items-center z-20 relative shrink-0"><div class="w-60"></div><div class="flex flex-col items-center justify-center text-center"><h1 class="game-logo-title text-5xl tracking-wide select-none transform hover:scale-105 transition-transform cursor-pointer drop-shadow-md">字灵守卫</h1><p class="mt-1 text-[22px] font-black text-[#2B2B38] tracking-wide select-none drop-shadow-xs">今天谁来守护书本？</p></div><div class="w-60 flex justify-end"><button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/70 hover:bg-white text-stone-500 hover:text-stone-700 border border-stone-300/70 text-xs font-bold shadow-xs transition-all cursor-pointer opacity-75 hover:opacity-100"><span class="text-xs">🔒</span><span class="tracking-wide">家长专区</span></button></div></header>
<!-- ==================== 中央舞台：左右滑动卡片轮播 ==================== -->
<main class="w-full max-w-6xl mx-auto px-6 z-20 my-auto flex items-center justify-between relative"><div class="absolute left-1/2 bottom-2 -translate-x-1/2 w-[580px] h-[36px] bg-amber-400/30 rounded-[100%] blur-md pointer-events-none z-0"></div><div class="absolute left-10 top-12 text-2xl select-none animate-bounce pointer-events-none opacity-80 filter drop-shadow">🦋</div><div class="absolute left-20 bottom-24 text-xl select-none animate-pulse pointer-events-none opacity-70">✨</div><div class="absolute right-12 top-16 text-2xl select-none animate-sway pointer-events-none opacity-80 filter drop-shadow">🦋</div><div class="absolute right-24 bottom-28 text-xl select-none animate-pulse pointer-events-none opacity-70">⭐</div><div class="w-full flex flex-col items-center justify-center z-10 relative"><div class="relative w-full flex items-center justify-center overflow-visible">
<!-- 左侧露出：朵朵 -->
<div class="absolute left-[-160px] w-[340px] h-[430px] bg-white/95 rounded-[36px] border-4 border-stone-200/80 p-5 flex flex-col items-center justify-center sub-candy-card opacity-60 pointer-events-none select-none shadow-md z-10"><div class="w-28 h-28 rounded-full bg-pink-100 border-4 border-pink-300 flex items-center justify-center shadow-md mb-3"><span class="text-6xl">🐰</span></div><h3 class="text-3xl font-black text-[#2B2B38]">朵朵</h3><div class="mt-1 px-3.5 py-0.5 rounded-full bg-pink-100 text-pink-600 font-extrabold text-xs border border-pink-300">大班</div><div class="flex items-center gap-2 mt-4"><div class="px-3 py-1.5 bg-orange-50 border border-orange-200 rounded-xl text-sm font-black text-orange-700">🔥 连续 2 天</div><div class="px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-xl text-sm font-black text-amber-800">⭐ 闯关 8 次</div></div></div>
<button class="absolute left-6 md:left-12 w-16 h-16 rounded-full bg-white/90 hover:bg-white text-[#2B2B38] text-3xl font-black flex items-center justify-center shadow-lg border-2 border-stone-200/80 hover:scale-110 active:scale-95 transition-all z-30 cursor-pointer" title="上一个">‹</button>
<!-- 中央：小虎 -->
<div class="relative flex flex-col items-center z-20"><div class="absolute -top-4 z-30 flex items-center gap-1.5 px-6 py-1.5 rounded-full bg-gradient-to-r from-amber-400 via-orange-500 to-amber-500 text-white font-black text-sm shadow-md border-[3px] border-white transform -rotate-1 animate-sway"><span class="text-base">👑</span> 上次是你</div><div class="w-[400px] h-[500px] bg-white rounded-[36px] border-[5px] border-amber-400 p-6 pt-7 flex flex-col items-center justify-between hero-candy-card relative overflow-hidden select-none shadow-xl"><button class="absolute top-4 right-4 w-12 h-12 rounded-full bg-stone-100 hover:bg-stone-200 active:scale-95 border border-stone-200 flex items-center justify-center text-stone-600 shadow-sm transition-all z-30 cursor-pointer" title="编辑资料"><span class="text-base">✏️</span></button><div class="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-amber-100/90 via-amber-50/50 to-transparent pointer-events-none rounded-t-[32px]"></div><div class="relative mt-3 mb-1 animate-hero-float"><div class="absolute -inset-2 rounded-full bg-amber-300/40 blur-sm pointer-events-none"></div><div class="w-32 h-32 rounded-full bg-gradient-to-b from-amber-200 via-amber-300 to-orange-300 border-4 border-white flex items-center justify-center shadow-lg relative"><span class="text-7xl filter drop-shadow-md transform hover:scale-110 transition-transform cursor-pointer">🐯</span><span class="absolute -bottom-1 -right-1 px-3 py-0.5 rounded-full bg-gradient-to-r from-amber-600 to-orange-600 text-white font-black text-xs border-2 border-white shadow-md flex items-center gap-1"><span>⭐</span> Lv.5</span></div></div><div class="flex flex-col items-center text-center -mt-1"><h2 class="text-[40px] font-black text-[#2B2B38] tracking-tight leading-tight">小虎</h2><div class="mt-1 px-4 py-0.5 rounded-full bg-amber-100 text-amber-900 font-extrabold text-xs border border-amber-300 shadow-xs">三年级</div></div><div class="flex items-center justify-center gap-3 w-full mt-2"><div class="flex-1 py-1.5 px-2 bg-orange-50 border border-orange-200 rounded-xl text-center text-[18px] font-black text-orange-700 shadow-xs flex items-center justify-center gap-1.5"><span>🔥</span> 连续 3 天</div><div class="flex-1 py-1.5 px-2 bg-amber-50 border border-amber-200 rounded-xl text-center text-[18px] font-black text-amber-800 shadow-xs flex items-center justify-center gap-1.5"><span>⭐</span> 闯关 12 次</div></div><button class="w-full h-[72px] mt-3 rounded-[26px] text-white font-black text-[30px] tracking-wide flex items-center justify-center gap-3 btn-candy-action border-[3px] border-emerald-300/60 cursor-pointer active:translate-y-1 shadow-lg"><span class="text-2xl animate-bounce">▶</span><span>开始守护！</span></button></div></div>
<button class="absolute right-6 md:right-12 w-16 h-16 rounded-full bg-white/90 hover:bg-white text-[#2B2B38] text-3xl font-black flex items-center justify-center shadow-lg border-2 border-stone-200/80 hover:scale-110 active:scale-95 transition-all z-30 cursor-pointer" title="下一个">›</button>
<!-- 右侧露出：圆圆 -->
<div class="absolute right-[-160px] w-[340px] h-[430px] bg-white/95 rounded-[36px] border-4 border-stone-200/80 p-5 flex flex-col items-center justify-center sub-candy-card opacity-60 pointer-events-none select-none shadow-md z-10"><div class="w-28 h-28 rounded-full bg-emerald-100 border-4 border-emerald-300 flex items-center justify-center shadow-md mb-3"><span class="text-6xl">🐼</span></div><h3 class="text-3xl font-black text-[#2B2B38]">圆圆</h3><div class="mt-1 px-3.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-extrabold text-xs border border-emerald-300">一年级</div><div class="flex items-center gap-2 mt-4"><div class="px-3 py-1.5 bg-orange-50 border border-orange-200 rounded-xl text-sm font-black text-orange-700">🔥 连续 5 天</div><div class="px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-xl text-sm font-black text-amber-800">⭐ 闯关 15 次</div></div></div></div>
<!-- 分页圆点：4 个孩子 + 末尾「＋」 -->
<div class="flex flex-col items-center mt-3 gap-1 z-30"><div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div><div class="w-7 h-2.5 rounded-full bg-amber-500 shadow-xs"></div><div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div><div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div><div class="w-5 h-5 rounded-full border-2 border-dashed border-stone-400 flex items-center justify-center text-stone-500 text-[10px] font-bold">+</div></div><span class="text-stone-400 text-xs font-bold tracking-wide select-none">← 左右滑动换人 →</span></div></div></main>
<!-- ==================== 底部草坪 ==================== -->
<footer class="w-full relative z-10 shrink-0">
<div class="relative w-full h-[72px] bg-gradient-to-t from-[#5FA340] to-[#78C257] border-t-4 border-[#94E66F]/80 shadow-lg flex items-end justify-between px-10 pb-1.5"><div class="absolute -top-3 left-1/4 text-sm filter drop-shadow-xs">🌼</div><div class="absolute -top-2 left-1/2 text-xs filter drop-shadow-xs">🌸</div><div class="absolute -top-3 left-3/4 text-sm filter drop-shadow-xs">🍀</div><div class="flex items-end gap-3 z-10 relative"><div class="flex flex-col items-center"><div class="relative bg-[#C28246] border-2 border-[#8F5620] rounded-xl p-1.5 pb-1 shadow-md flex items-end gap-1"><div class="w-4 h-9 bg-rose-500 rounded-t border border-rose-600 flex items-center justify-center text-[9px] text-white font-black [writing-mode:vertical-rl]">语文</div><div class="w-3.5 h-8 bg-amber-400 rounded-t border border-amber-500 flex items-center justify-center text-[8px] text-amber-950 font-black [writing-mode:vertical-rl]">汉字</div><div class="w-4 h-10 bg-sky-500 rounded-t border border-sky-600 flex items-center justify-center text-[9px] text-white font-black [writing-mode:vertical-rl]">故事</div><span class="absolute -top-3.5 inset-x-0 mx-auto w-max text-[9px] bg-amber-300 text-amber-950 font-black px-2 py-[1px] rounded-full shadow border border-amber-400">🛡️ 书库</span></div><div class="w-full flex justify-between px-1.5 -mt-0.5"><div class="w-2 h-1 bg-[#8F5620] rounded-b"></div><div class="w-2 h-1 bg-[#8F5620] rounded-b"></div></div></div><div class="flex flex-col items-center -mb-0.5 animate-sway"><div class="w-10 h-10 rounded-full bg-amber-100 border-2 border-amber-300 flex items-center justify-center shadow-md"><span class="text-xl filter drop-shadow">🌻</span></div><span class="mt-0.5 px-2 py-[1px] rounded-full bg-emerald-700 text-white font-bold text-[10px] shadow-xs">向日葵</span></div><div class="flex flex-col items-center -mb-0.5 animate-hero-float"><div class="relative"><div class="w-10 h-10 rounded-full bg-emerald-100 border-2 border-emerald-400 flex items-center justify-center shadow-md transform hover:scale-110 transition-transform"><span class="text-xl filter drop-shadow">🌱</span></div><span class="absolute -top-1 -right-2 text-xs animate-ping">✨</span></div><span class="mt-0.5 px-2 py-[1px] rounded-full bg-emerald-800 text-white font-black text-[10px] shadow-xs">豌豆射手</span></div></div><div class="flex items-end gap-2 z-10 relative mr-4"><div class="flex flex-col items-center mb-2 -mr-1 z-20 transform -rotate-6 animate-sway"><div class="px-2 py-0.5 bg-[#FAF4E6] border-2 border-[#8F5620] rounded-md shadow-md flex items-center gap-1"><span class="text-xs font-black text-[#8F5620] leading-none tracking-wide">字 zì</span></div><div class="w-1 h-3 bg-[#8F5620] rounded-b"></div></div><div class="flex flex-col items-center -mb-0.5"><div class="w-10 h-10 rounded-2xl bg-teal-100/90 border-2 border-teal-400 flex items-center justify-center shadow-md transform hover:rotate-6 transition-transform"><span class="text-xl filter drop-shadow">🧟‍♂️</span></div><span class="mt-0.5 px-2 py-[1px] rounded-full bg-stone-700/80 text-white font-bold text-[10px] shadow-xs">呆萌僵尸</span></div></div></div></footer>
</body></html>
