<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=1194, height=834, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>字灵守卫 - 添加小朋友</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..1000;1,6..12,300..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            paper: '#FAF2DE',
            sunburst: '#FFEBB0',
            vibrantOrange: '#F28C2E',
            amberShadow: '#D97706',
            emeraldMain: '#3DA885',
            emeraldDeep: '#247359',
            starGold: '#FFC93C',
            starStroke: '#E0A100',
            inkText: '#2B2B38',
            subText: '#8C857A'
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Nunito Sans", "system-ui", "-apple-system", "sans-serif"],
            display: ["Nunito Sans", "system-ui", "-apple-system", "sans-serif"],
            body: ["Nunito Sans", "system-ui", "-apple-system", "sans-serif"],
            label: ["Nunito Sans", "system-ui", "-apple-system", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;
    }
    .candy-logo-shadow {
      text-shadow:
        0 2px 0 #fff,
        0 -2px 0 #fff,
        -2px 0 0 #fff,
        2px 0 0 #fff,
        0 6px 0 #D97706,
        0 10px 18px rgba(217, 119, 6, 0.35);
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    .animate-float {
      animation: floatGentle 4s ease-in-out infinite;
    }
    .animate-glow {
      animation: pulseGlow 5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FAF2DE] text-[#2B2B38] font-body select-none overflow-hidden m-0 p-0 w-[1194px] h-[834px] relative flex flex-col justify-between">
<!-- ================= 背景：聚光灯与装饰 ================= -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-[42%] left-[58%] -translate-x-1/2 -translate-y-1/2 w-[780px] h-[780px] bg-gradient-to-r from-amber-200/50 via-yellow-100/35 to-transparent rounded-full blur-3xl animate-glow"></div>
<div class="absolute top-[18%] left-[22%] w-[450px] h-[450px] bg-gradient-to-br from-emerald-100/40 to-transparent rounded-full blur-2xl"></div>
<div class="absolute inset-0 opacity-[0.07]" style="background-image: radial-gradient(#8C857A 1.5px, transparent 1.5px); background-size: 28px 28px;"></div>
<div class="absolute top-28 left-[18%] text-3xl animate-float opacity-80" style="animation-delay: 0.3s;">✨</div>
<div class="absolute top-44 right-[24%] text-2xl animate-float opacity-75" style="animation-delay: 1.2s;">⭐</div>
<div class="absolute top-20 right-[12%] text-3xl animate-float opacity-70" style="animation-delay: 2.1s;">🦋</div>
<div class="absolute top-[520px] left-[14%] text-2xl animate-float opacity-60" style="animation-delay: 1.7s;">✨</div>
<div class="absolute top-[480px] right-[10%] text-3xl animate-float opacity-65" style="animation-delay: 0.8s;">🦋</div>
</div>
<!-- ================= 顶部 ================= -->
<header class="relative z-30 w-full h-[106px] pt-4 px-10 flex items-center justify-between">
<!-- 本地改动：Stitch 原稿此处是一个返回按钮，首页不需要，改为占位 -->
<div class="w-48"></div>
<div class="flex-1 flex flex-col items-center justify-center -mt-1 text-center">
<h1 class="candy-logo-shadow text-[44px] leading-tight font-black tracking-wider text-amber-500 font-display select-none">
        字灵守卫
      </h1>
<p class="text-[20px] font-black text-[#374151] tracking-wide mt-0.5 flex items-center gap-1.5">
<span>📖</span>
<span>今天谁来守护书本？</span>
</p>
</div>
<div class="w-48 flex justify-end">
<button class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-stone-200/70 hover:bg-stone-200 text-stone-600 font-bold text-base shadow-[0_2px_0_#d1d5db] active:translate-y-0.5 transition-all cursor-pointer border border-white/60" title="家长专区需长按解锁">
<span class="material-symbols-outlined text-xl">lock</span>
<span>家长专区</span>
</button>
</div>
</header>
<!-- ================= 轮播（停在末尾的添加卡） ================= -->
<main class="relative z-20 w-full flex-1 flex items-center justify-center overflow-hidden px-8">
<!-- 上一张：乐乐（左侧露出一半，缩小、半透明） -->
<div class="absolute left-[-160px] w-[390px] h-[480px] bg-white/95 rounded-[36px] p-7 flex flex-col justify-between shadow-[0_12px_28px_rgba(0,0,0,0.06),0_6px_0_#e5e7eb] border-4 border-amber-200/70 opacity-60 scale-[.85] pointer-events-none transform -rotate-2">
<div class="flex items-center gap-4">
<div class="w-20 h-20 rounded-full bg-amber-100 border-4 border-amber-400 shadow-inner flex items-center justify-center text-4xl">
          🦊
        </div>
<div>
<div class="flex items-center gap-2">
<span class="text-3xl font-black text-stone-800">乐乐</span>
<span class="px-3 py-1 bg-amber-500 text-white text-sm font-extrabold rounded-full shadow-[0_2px_0_#b45309]">Lv.2</span>
</div>
<span class="inline-block mt-1 px-3 py-0.5 bg-amber-100 text-amber-800 font-bold rounded-full text-xs">
            二年级
          </span>
</div>
</div>
<div class="space-y-3 my-4">
<div class="flex items-center gap-3 p-3 bg-amber-50/70 rounded-2xl border border-amber-200/50">
<span class="text-2xl">🔥</span>
<span class="font-black text-amber-900 text-lg">连续守护 2 天</span>
</div>
<div class="flex items-center gap-3 p-3 bg-amber-50/70 rounded-2xl border border-amber-200/50">
<span class="text-2xl">⭐</span>
<span class="font-black text-amber-900 text-lg">累计闯关 6 次</span>
</div>
</div>
<div class="text-center py-2 text-stone-400 font-bold text-sm">
        点击切换到乐乐
      </div>
</div>
<!-- 左箭头 -->
<button aria-label="上一个小朋友" class="absolute left-[calc(50%-300px)] z-30 w-16 h-16 rounded-full bg-white/95 text-amber-600 shadow-[0_5px_0_#e5e7eb,0_8px_20px_rgba(0,0,0,0.08)] flex items-center justify-center text-4xl font-black hover:scale-110 active:scale-95 active:translate-y-1 transition-all cursor-pointer border border-amber-200/60">
      ‹
    </button>
<!-- 中央：添加小朋友卡 -->
<div class="relative z-20 w-[410px] h-[510px] bg-gradient-to-b from-[#FFFDF8] to-[#FFF8EA] rounded-[36px] border-4 border-dashed border-amber-400 shadow-[0_16px_36px_rgba(242,140,46,0.18),0_8px_0_#FDE68A] flex flex-col items-center justify-between p-8 text-center">
<div class="absolute -top-3.5 -right-3.5 bg-amber-400 text-white font-black text-xs px-3 py-1.5 rounded-full shadow-[0_3px_0_#d97706] tracking-wider flex items-center gap-1">
<span>✨</span> 欢迎新队员
      </div>
<div class="mt-2 flex flex-col items-center">
<div class="relative group cursor-pointer">
<div class="absolute -inset-2.5 bg-gradient-to-tr from-amber-300 to-amber-100 rounded-full blur-md opacity-70 group-hover:opacity-100 transition-opacity"></div>
<div class="relative w-28 h-28 rounded-full bg-white border-4 border-amber-200 shadow-[0_8px_0_#FCD34D,0_14px_24px_rgba(245,158,11,0.25)] flex items-center justify-center text-amber-500 hover:scale-105 active:scale-95 active:translate-y-1.5 transition-all">
<span class="text-6xl font-black leading-none -mt-1 select-none">+</span>
</div>
</div>
<h2 class="text-[34px] font-black text-[#1F2937] tracking-tight mt-5">
          添加小朋友
        </h2>
<p class="text-[19px] font-bold text-[#6B7280] mt-1.5 max-w-[280px]">
          给新来的小守卫建一张卡
        </p>
</div>
<div class="w-full flex flex-col items-center space-y-2.5 mb-1">
<button class="w-full h-[72px] rounded-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white text-[28px] font-black tracking-wide shadow-[0_6px_0_#B45309,0_12px_20px_rgba(217,119,6,0.35)] active:translate-y-1.5 active:shadow-[0_2px_0_#B45309] transition-all flex items-center justify-center gap-3 cursor-pointer">
<span class="text-3xl leading-none font-bold">＋</span>
<span>添加</span>
</button>
<span class="text-[15px] font-semibold text-stone-400 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">info</span>
          请爸爸妈妈帮忙填写
        </span>
</div>
</div>
<!-- 右侧留空：已经是轮播最后一张（本地改动：去掉 Stitch 原稿里把卡片挤偏的占位 div） -->
</main>
<!-- ================= 分页指示 ================= -->
<section class="relative z-20 w-full flex flex-col items-center justify-center pb-2">
<div class="flex items-center gap-3 bg-white/70 px-5 py-2.5 rounded-full shadow-inner border border-amber-200/40">
<div class="w-3.5 h-3.5 rounded-full bg-stone-300" title="小虎"></div>
<div class="w-3.5 h-3.5 rounded-full bg-stone-300" title="朵朵"></div>
<div class="w-3.5 h-3.5 rounded-full bg-stone-300" title="圆圆"></div>
<div class="w-3.5 h-3.5 rounded-full bg-stone-300" title="乐乐"></div>
<div class="h-6 px-3 bg-amber-500 text-white rounded-full flex items-center justify-center font-black text-sm shadow-[0_2px_0_#b45309] gap-1">
<span>＋</span>
<span class="text-xs">新成员</span>
</div>
</div>
<div class="text-[15px] font-bold text-stone-500 tracking-wider mt-1.5">
      ← 左右滑动换人 →
    </div>
</section>
<!-- ================= 底部草坪 ================= -->
<footer class="relative z-10 w-full h-[72px] bg-gradient-to-t from-emerald-600 via-emerald-500 to-emerald-400 border-t-4 border-emerald-300/80 shadow-[0_-4px_12px_rgba(36,115,89,0.2)] flex items-end justify-between px-10 pb-2">
<div class="absolute -top-3 left-0 right-0 h-3 flex justify-around pointer-events-none opacity-90 overflow-hidden">
<div class="w-4 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-3 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-5 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-4 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-3 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-6 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-4 h-3 bg-emerald-400 rounded-t-full"></div>
<div class="w-5 h-3 bg-emerald-400 rounded-t-full"></div>
</div>
<div class="flex items-end gap-5 pl-4 -mb-1">
<div class="flex items-center gap-1.5 bg-amber-900/90 text-amber-100 px-3.5 py-1.5 rounded-2xl border-2 border-amber-600 shadow-[0_3px_0_#451a03] text-sm font-black">
<span class="text-xl">📚</span>
<span>字灵书阁</span>
</div>
<div class="relative flex flex-col items-center">
<div class="text-3xl animate-float">🌻</div>
<div class="w-6 h-1.5 bg-emerald-800/40 rounded-full blur-[1px]"></div>
</div>
<div class="relative flex flex-col items-center">
<div class="text-3xl" style="transform: scaleX(-1);">🌱</div>
<div class="w-6 h-1.5 bg-emerald-800/40 rounded-full blur-[1px]"></div>
</div>
</div>
<div class="flex items-center gap-8 text-lg pb-1 opacity-80">
<span>🌼</span>
<span>🌸</span>
<span>🌼</span>
</div>
<div class="flex items-end gap-3 pr-4 -mb-0.5">
<div class="relative flex items-end gap-2">
<div class="bg-amber-100 text-stone-800 border-2 border-amber-800 px-3 py-1 rounded-xl shadow-[0_2px_0_#78350f] text-center font-black">
<div class="text-base leading-none">字</div>
<div class="text-[9px] text-amber-700 leading-tight">zì</div>
</div>
<div class="text-3xl animate-float" style="animation-delay: 1.5s;">
          🧟
        </div>
</div>
</div>
</footer>
</body></html>
