<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>字灵守卫 · 档案主页（落地版）</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..1000;1,6..12,300..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            DEFAULT: "1rem",
            lg: "2rem",
            xl: "3rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Nunito Sans", "sans-serif"],
            display: ["Nunito Sans", "sans-serif"],
            body: ["Nunito Sans", "sans-serif"],
            label: ["Nunito Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes pulse-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.08); }
    }
    .animate-gift {
      animation: pulse-bounce 1.6s ease-in-out infinite;
    }
    @keyframes float-badge {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-4px); }
    }
    .badge-float {
      animation: float-badge 3s ease-in-out infinite;
    }
    .coin { display: inline-block; filter: sepia(1) saturate(6) hue-rotate(-12deg) brightness(1.05); }
  </style>
</head>
<body class="bg-[#FAF2DE] text-[#2B2B38] font-body w-full select-none">
<main class="max-w-[1000px] mx-auto px-10 py-8 flex flex-col gap-7">
<!-- ① 新增：成长卡（替换原来「头像 + 名字 + 编辑档案」那一行） -->
<section class="w-full bg-white rounded-3xl p-5 border-4 border-amber-200/80 shadow-[0_8px_0_#EAD7B5] flex items-center justify-between gap-6 relative overflow-hidden">
<!-- 柔和星光背景质感 -->
<div class="absolute -right-8 -top-8 w-40 h-40 bg-amber-100/50 rounded-full blur-2xl pointer-events-none"></div>
<!-- 左侧：大头像与等级标签 -->
<div class="flex flex-col items-center flex-shrink-0 relative">
<div class="relative p-1.5 rounded-full bg-gradient-to-tr from-amber-400 via-yellow-300 to-amber-500 shadow-md">
<div class="w-24 h-24 rounded-full bg-amber-50 border-4 border-white flex items-center justify-center shadow-inner text-5xl">
            🦊
          </div>
<!-- 光芒徽章粒子装饰 -->
<div class="absolute -top-1 -right-1 bg-amber-400 text-white rounded-full p-1 border-2 border-white shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-sm">auto_awesome</span>
</div>
</div>
<!-- 立体丝带等级牌 -->
<div class="-mt-3.5 px-4 py-1 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-headline font-black text-sm rounded-full shadow-[0_3px_0_#b45309] border-2 border-white tracking-wide z-10 flex items-center gap-1">
<span>Lv.5</span>
<span class="text-xs font-bold text-amber-100">小小守卫</span>
</div>
</div>
<!-- 中间：主力成长与经验条展示 -->
<div class="flex-1 flex flex-col justify-center px-4">
<div class="flex items-center gap-3 mb-2">
<h2 class="font-display font-black text-3xl text-amber-950 tracking-tight">小米</h2>
<span class="px-3.5 py-1 bg-amber-100 text-amber-800 font-label font-bold text-sm rounded-full border border-amber-300/70">
            二年级 · 标准难度
          </span>
</div>
<!-- 翡翠绿经验进度条 -->
<div class="w-full flex items-center gap-3">
<div class="flex-1 h-9 bg-stone-200/80 rounded-full p-1 border-2 border-stone-300/80 shadow-inner relative flex items-center">
<!-- 进度填充条 -->
<div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 rounded-full relative shadow-[0_2px_0_#059669] flex items-center justify-end pr-3 transition-all duration-500" style="width: 85%;">
<!-- 高光反射层 -->
<div class="absolute top-0.5 left-2 right-2 h-2.5 bg-white/35 rounded-full pointer-events-none"></div>
<span class="text-xs font-black text-white drop-shadow-sm flex items-center gap-0.5">
<span class="material-symbols-outlined text-sm">stars</span> 390 / 460 经验
              </span>
</div>
</div>
<!-- 经验条终点跳动礼物盒 -->
<div class="animate-gift flex flex-col items-center cursor-pointer flex-shrink-0" title="升级奖励">
<span class="text-3xl drop-shadow-md">🎁</span>
</div>
</div>
<!-- 激励文案 -->
<div class="mt-2 flex items-center gap-1.5 text-stone-600 font-bold text-sm">
<span class="material-symbols-outlined text-amber-500 text-base">military_tech</span>
<span>再得 <strong class="text-amber-600 font-black text-base">70</strong> 经验升到 Lv.6，解锁</span>
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-xs font-black">
            🎉 彩纸礼花特效！
          </span>
</div>
</div>
<!-- 右侧：积分与连续打卡牌 -->
<div class="flex flex-col gap-2.5 items-end flex-shrink-0">
<!-- 糖果立体金色积分胶囊 -->
<div class="px-6 py-2.5 bg-gradient-to-r from-amber-400 to-yellow-400 rounded-full border-2 border-amber-300 shadow-[0_4px_0_#d97706] flex items-center gap-2">
<span class="text-2xl"><span class="coin">🪙</span></span>
<span class="font-headline font-black text-2xl text-amber-950 tracking-wider">386</span>
<span class="text-xs font-extrabold text-amber-900 bg-amber-200/70 px-2 py-0.5 rounded-full">积分</span>
</div>
<button class="px-5 py-2 bg-white rounded-full border-2 border-stone-300 shadow-[0_4px_0_#a8a29e] font-black text-stone-600 text-base flex items-center gap-1.5"><span class="material-symbols-outlined text-xl">edit</span>编辑档案</button>
</div>
</section>
<!-- ② 新增：收藏馆 / 徽章墙入口 -->
<section class="w-full grid grid-cols-2 gap-5 h-[132px]">
<!-- 橙色渐变主卡「🎁 收藏馆」 -->
<div class="bg-gradient-to-br from-amber-400 via-orange-400 to-amber-500 rounded-3xl p-5 border-4 border-amber-300 text-white shadow-[0_8px_0_#d97706] flex items-center justify-between relative overflow-hidden cursor-pointer hover:scale-[1.01] active:translate-y-1 transition-all">
<!-- 背景暗纹与光晕 -->
<div class="absolute -right-6 -bottom-6 w-36 h-36 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
<!-- 文本内容 -->
<div class="flex flex-col justify-between h-full z-10 max-w-[65%]">
<div>
<div class="flex items-center gap-2">
<span class="text-2xl">🎁</span>
<h3 class="font-display font-black text-2xl tracking-wide text-white drop-shadow-sm">收藏馆</h3>
</div>
<p class="font-headline font-bold text-lg text-amber-100 mt-1">外观与特效</p>
</div>
<p class="text-xs font-semibold text-amber-50/90 bg-black/10 px-3 py-1.5 rounded-full inline-block backdrop-blur-sm">
            ✨ 用积分换闪亮子弹与僵尸退场
          </p>
</div>
<!-- 右侧插画元素与 NEW 徽标 -->
<div class="flex flex-col items-end justify-between h-full z-10">
<span class="px-3 py-0.5 bg-rose-500 text-white font-black text-xs rounded-full border-2 border-white shadow-md animate-pulse">
            NEW 新外观
          </span>
<div class="flex items-center gap-1 text-4xl filter drop-shadow-lg">
<span>⭐</span>
<span>🌸</span>
<span>🎉</span>
</div>
</div>
</div>
<!-- 紫色渐变主卡「🏅 徽章墙」 -->
<div class="bg-gradient-to-br from-purple-500 via-violet-500 to-indigo-500 rounded-3xl p-5 border-4 border-purple-300 text-white shadow-[0_8px_0_#7c3aed] flex items-center justify-between relative overflow-hidden cursor-pointer hover:scale-[1.01] active:translate-y-1 transition-all">
<!-- 文本内容 -->
<div class="flex flex-col justify-between h-full z-10 max-w-[62%]">
<div>
<div class="flex items-center gap-2">
<span class="text-2xl">🏅</span>
<h3 class="font-display font-black text-2xl tracking-wide text-white drop-shadow-sm">徽章墙</h3>
</div>
<p class="font-headline font-bold text-lg text-purple-100 mt-1">荣誉殿堂</p>
</div>
<div class="flex items-center gap-2 bg-black/15 px-3 py-1.5 rounded-full inline-block backdrop-blur-sm">
<span class="material-symbols-outlined text-amber-300 text-sm">stars</span>
<span class="text-xs font-bold text-purple-50">已收集 <strong class="text-amber-300 font-black text-sm">5</strong> / 12 枚勋章</span>
</div>
</div>
<!-- 右侧叠放三枚璀璨勋章 -->
<div class="flex items-center -space-x-4 pr-1 z-10">
<div class="w-14 h-14 rounded-2xl bg-amber-400 border-2 border-white shadow-md flex items-center justify-center text-2xl badge-float" title="特级护盾">
            🛡️
          </div>
<div class="w-15 h-15 rounded-2xl bg-yellow-300 border-2 border-white shadow-lg flex items-center justify-center text-3xl badge-float" style="animation-delay: 0.5s;" title="3星满星通关">
            ⭐
          </div>
<div class="w-14 h-14 rounded-2xl bg-emerald-400 border-2 border-white shadow-md flex items-center justify-center text-2xl badge-float" style="animation-delay: 1s;" title="初出茅庐">
            🌱
          </div>
<div class="w-14 h-14 rounded-2xl bg-white/25 border-2 border-white/60 shadow-md flex items-center justify-center text-2xl" title="还没得到">🔒</div>
</div>
</div>
</section>
<!-- ③ 以下是现有主页内容：功能不变，只换成同一套圆角卡片样式 -->
<div class="h-0.5 bg-amber-200/70 rounded-full -my-2"></div>
<section><div class="flex w-fit bg-white rounded-full p-1.5 border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5] text-xl font-black"><span class="px-8 py-2 rounded-full bg-[#F28C2E] text-white shadow-[0_3px_0_#C6650B]">语文</span><span class="px-8 py-2 rounded-full text-stone-500">英语</span></div></section>
<section class="flex flex-col gap-3">
  <div class="flex items-center gap-3"><h2 class="text-2xl font-black">题库</h2><span class="text-lg text-stone-500 font-bold">二年级语文 · 上册</span></div>
  <div class="grid grid-cols-4 gap-3 text-lg font-black">
    <span class="px-4 py-3 rounded-2xl bg-[#3DA885] text-white text-center shadow-[0_4px_0_#247359]">✓ 全部单元</span><span class="px-4 py-3 rounded-2xl bg-white text-stone-700 text-center border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5]">识字一 · 秋天</span><span class="px-4 py-3 rounded-2xl bg-white text-stone-700 text-center border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5]">识字二 · 拼音</span><span class="px-4 py-3 rounded-2xl bg-white text-stone-700 text-center border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5]">课文 · 小蝌蚪</span><span class="px-4 py-3 rounded-2xl bg-white text-stone-700 text-center border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5]">成语小站</span><span class="px-4 py-3 rounded-2xl bg-white text-stone-700 text-center border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5]">古诗诵读</span>
  </div>
</section>
<section class="flex flex-col gap-3">
  <h2 class="text-2xl font-black">难度</h2>
  <div class="flex w-fit bg-white rounded-full p-1.5 border-2 border-amber-200 shadow-[0_4px_0_#EAD7B5] text-xl font-black"><span class="px-8 py-2 rounded-full text-stone-500">入门</span><span class="px-8 py-2 rounded-full bg-[#F28C2E] text-white shadow-[0_3px_0_#C6650B]">标准</span><span class="px-8 py-2 rounded-full text-stone-500">挑战</span></div>
</section>
<section class="flex items-center gap-5 pb-6">
  <button class="w-[300px] h-[84px] rounded-full bg-[#3DA885] text-white text-3xl font-black shadow-[0_8px_0_#247359] flex items-center justify-center gap-3"><span>▶</span>开始闯关</button>
  <button class="w-[250px] h-[84px] rounded-full bg-[#F28C2E] text-white text-2xl font-black shadow-[0_8px_0_#C6650B]">错题复习（3）</button>
  <button class="h-[64px] px-6 rounded-full bg-white border-2 border-stone-300 text-stone-600 text-xl font-black shadow-[0_5px_0_#a8a29e]">📖 错题本</button>
</section>
</main>
</body></html>
